plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.nik.kafka'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	maven { url 'https://packages.confluent.io/maven/' }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	runtimeOnly 'org.postgresql:postgresql'

	// Avro & Schema Registry
	implementation 'org.apache.avro:avro:1.11.3'
	implementation 'io.confluent:kafka-avro-serializer:7.6.1'
	implementation 'io.confluent:kafka-schema-registry-client:7.6.1'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'
}

// Avro code generation
plugins.withId('java') {
	sourceSets.main.java.srcDirs += ["$buildDir/generated/avro"]
}

tasks.register('generateAvroSources') {
	def avroSrcDir = file('src/main/avro')
	def avroOutDir = file("$buildDir/generated/avro")
	inputs.dir avroSrcDir
	outputs.dir avroOutDir
	doLast {
		avroOutDir.mkdirs()
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
