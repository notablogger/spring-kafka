version: '3.8'

services:

  # ─── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: nik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nik_kafka_db
      POSTGRES_USER: nikuser
      POSTGRES_PASSWORD: nikpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nikuser -d nik_kafka_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Confluent Zookeeper ──────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: nik-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Confluent Kafka Broker ───────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: nik-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"       # external (host) access
      - "29092:29092"     # internal (container-to-container) access
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Confluent Schema Registry ────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: nik-schema-registry
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  # ─── Confluent Control Center (Kafka UI) ─────────────────────
  control-center:
    image: confluentinc/cp-enterprise-control-center:7.6.1
    container_name: nik-control-center
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
    ports:
      - "9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: kafka:29092
      CONTROL_CENTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      PORT: 9021

  # ─── Kafka Topic Init ─────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: nik-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      echo 'Creating Kafka topics...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic employee_topic \
        --partitions 3 \
        --replication-factor 1
      echo 'Topics created:'
      kafka-topics --bootstrap-server kafka:29092 --list
      "
    restart: on-failure

  # ─── Schema Registry Init ─────────────────────────────────────
  schema-registry-init:
    image: alpine:3.19
    container_name: nik-schema-registry-init
    depends_on:
      schema-registry:
        condition: service_started
    restart: on-failure
    volumes:
      - ./src/main/avro/message.avsc:/schemas/employee.avsc:ro
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      apk add --no-cache curl jq > /dev/null 2>&1

      echo 'Waiting for Schema Registry...'
      until curl -sf http://schema-registry:8081/subjects > /dev/null; do
        sleep 3
      done

      echo 'Registering EmployeeEvent Avro schema from file...'
      SCHEMA=\$(cat /schemas/employee.avsc | jq -c tostring)
      PAYLOAD=\$(jq -n --argjson schema \"\$SCHEMA\" '{schema: \$schema, schemaType: \"AVRO\"}')

      curl -sf -X POST http://schema-registry:8081/subjects/employee_topic-value/versions \
        -H 'Content-Type: application/vnd.schemaregistry.v1+json' \
        -d \"\$PAYLOAD\"

      echo ''
      echo 'Schema registered. Registered subjects:'
      curl -sf http://schema-registry:8081/subjects
      echo ''
      "

  # ─── Spring Boot Application ──────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nik-kafka-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nik_kafka_db
      SPRING_DATASOURCE_USERNAME: nikuser
      SPRING_DATASOURCE_PASSWORD: nikpassword
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

volumes:
  postgres_data:
